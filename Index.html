<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>قص الصور الشبكية</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, "Segoe UI", Tahoma, Arial, sans-serif;
    background: #14161a;
    color: #eee;
    margin: 0;
    padding: 24px 16px 60px;
  }
  h1 { font-size: 20px; text-align: center; margin-bottom: 4px; }
  p.sub { text-align: center; color: #999; margin-top: 0; font-size: 14px; }
  .container { max-width: 720px; margin: 0 auto; }
  .card {
    background: #1e2126;
    border: 1px solid #2c2f36;
    border-radius: 12px;
    padding: 18px;
    margin-bottom: 16px;
  }
  .row { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
  .field { flex: 1; min-width: 110px; }
  label { display: block; font-size: 13px; color: #aaa; margin-bottom: 4px; }
  input[type=number] {
    width: 100%; padding: 8px 10px; border-radius: 8px;
    border: 1px solid #3a3f47; background: #14161a; color: #eee; font-size: 14px;
  }
  input[type=file] {
    width: 100%; padding: 10px; border-radius: 8px;
    border: 1px dashed #3a3f47; background: #14161a; color: #ccc; font-size: 13px;
  }
  button {
    width: 100%; padding: 12px; border: none; border-radius: 8px;
    background: #4f7cff; color: #fff; font-size: 15px; font-weight: 600;
    cursor: pointer; margin-top: 4px;
  }
  button:disabled { background: #3a3f47; cursor: not-allowed; }
  button.secondary { background: #2c2f36; }
  #grid {
    display: grid; gap: 6px; margin-top: 16px;
  }
  .tile { position: relative; border-radius: 6px; overflow: hidden; border: 1px solid #2c2f36; }
  .tile img { width: 100%; display: block; }
  .tile a {
    position: absolute; bottom: 4px; left: 4px; right: 4px;
    background: rgba(0,0,0,.65); color: #fff; text-align: center;
    font-size: 11px; padding: 4px 0; border-radius: 4px; text-decoration: none;
  }
  #status { text-align: center; font-size: 13px; color: #999; margin-top: 8px; min-height: 18px; }
  canvas { display: none; }
</style>
</head>
<body>
<div class="container">
  <h1>قص الصور الشبكية</h1>
  <p class="sub">ارفع صورة مقسّمة (زي 3×3) وهيتقصّلك كل صورة لوحدها بالحجم اللي تحدده</p>

  <div class="card">
    <div class="row">
      <div class="field">
        <label>عدد الأعمدة (Columns)</label>
        <input type="number" id="cols" value="3" min="1" max="10">
      </div>
      <div class="field">
        <label>عدد الصفوف (Rows)</label>
        <input type="number" id="rows" value="3" min="1" max="10">
      </div>
    </div>
    <div class="row">
      <div class="field">
        <label>عرض الصورة الناتجة (px)</label>
        <input type="number" id="outW" value="500" min="16">
      </div>
      <div class="field">
        <label>ارتفاع الصورة الناتجة (px)</label>
        <input type="number" id="outH" value="500" min="16">
      </div>
    </div>
    <div class="row">
      <div class="field" style="flex-basis:100%">
        <label>اختر الصورة</label>
        <input type="file" id="fileInput" accept="image/*">
      </div>
    </div>
    <button id="splitBtn" disabled>قص الصورة</button>
    <button id="zipBtn" class="secondary" style="display:none">تحميل الكل كـ ZIP</button>
    <div id="status"></div>
  </div>

  <div id="grid"></div>
</div>

<canvas id="workCanvas"></canvas>

<script>
const fileInput = document.getElementById('fileInput');
const splitBtn = document.getElementById('splitBtn');
const zipBtn = document.getElementById('zipBtn');
const grid = document.getElementById('grid');
const status = document.getElementById('status');
const workCanvas = document.getElementById('workCanvas');
const ctx = workCanvas.getContext('2d');

let sourceImg = null;
let tileBlobs = []; // {name, blob, url}

fileInput.addEventListener('change', () => {
  const file = fileInput.files[0];
  if (!file) return;
  const img = new Image();
  img.onload = () => {
    sourceImg = img;
    splitBtn.disabled = false;
    status.textContent = `الصورة اتحملت: ${img.width}×${img.height}px`;
  };
  img.src = URL.createObjectURL(file);
});

splitBtn.addEventListener('click', () => {
  if (!sourceImg) return;
  const cols = parseInt(document.getElementById('cols').value) || 1;
  const rows = parseInt(document.getElementById('rows').value) || 1;
  const outW = parseInt(document.getElementById('outW').value) || 500;
  const outH = parseInt(document.getElementById('outH').value) || 500;

  const cellW = sourceImg.width / cols;
  const cellH = sourceImg.height / rows;

  grid.innerHTML = '';
  grid.style.gridTemplateColumns = `repeat(${Math.min(cols, 5)}, 1fr)`;
  tileBlobs = [];

  let index = 0;
  let pending = rows * cols;

  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      index++;
      workCanvas.width = outW;
      workCanvas.height = outH;
      ctx.clearRect(0, 0, outW, outH);
      ctx.drawImage(
        sourceImg,
        c * cellW, r * cellH, cellW, cellH,
        0, 0, outW, outH
      );

      const name = `tile_${index}.png`;
      workCanvas.toBlob((blob) => {
        const url = URL.createObjectURL(blob);
        tileBlobs.push({ name, blob, url });

        const tile = document.createElement('div');
        tile.className = 'tile';
        tile.innerHTML = `<img src="${url}"><a href="${url}" download="${name}">تحميل</a>`;
        grid.appendChild(tile);

        pending--;
        if (pending === 0) {
          status.textContent = `تم تقطيع ${rows * cols} صورة بمقاس ${outW}×${outH}px`;
          zipBtn.style.display = 'block';
        }
      }, 'image/png');
    }
  }
});

zipBtn.addEventListener('click', async () => {
  zipBtn.disabled = true;
  zipBtn.textContent = 'جاري التجهيز...';
  const zip = new JSZip();
  tileBlobs
    .sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true }))
    .forEach(t => zip.file(t.name, t.blob));
  const content = await zip.generateAsync({ type: 'blob' });
  const url = URL.createObjectURL(content);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'tiles.zip';
  document.body.appendChild(a);
  a.click();
  a.remove();
  zipBtn.disabled = false;
  zipBtn.textContent = 'تحميل الكل كـ ZIP';
});
</script>
</body>
</html>
